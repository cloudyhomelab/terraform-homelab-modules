version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: ["/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns: ["*"]
